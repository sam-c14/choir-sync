name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Application
        run: pnpm exec nx build choir-client

      - name: Sync Capacitor Android
        run: |
          cd choir-client
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd choir-client/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: choir-client/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare Release Asset
        run: |
          SIGNED_FILE="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          if [ -z "$SIGNED_FILE" ] || [ ! -f "$SIGNED_FILE" ]; then
            SIGNED_FILE=$(find choir-client/android/app/build/outputs/apk/release -name "*signed*.apk" | head -n 1)
          fi
          if [ -z "$SIGNED_FILE" ] || [ ! -f "$SIGNED_FILE" ]; then
            SIGNED_FILE=$(find choir-client/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "Using signed APK: $SIGNED_FILE"
          cp "$SIGNED_FILE" ChoirSync-Latest.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChoirSync-Latest.apk
          path: ChoirSync-Latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: ChoirSync Latest Release
          body: "Automated build of the latest ChoirSync Android APK."
          draft: false
          prerelease: false
          make_latest: "true"
          files: ChoirSync-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
