<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DGC Resound</title>
    <base href="/" />

    <!-- Synchronous theme resolver to prevent theme flash (FOUT) before first paint -->
    <script>
      (function () {
        try {
          var storageKey = 'choir-sync-theme';
          var stored = localStorage.getItem(storageKey);
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Critical background styles matching Tailwind base theme -->
    <style>
      :root {
        color-scheme: light;
      }
      :root.dark {
        color-scheme: dark;
      }
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #171717;
        background-color: oklch(0.145 0 0);
      }
      body {
        margin: 0;
        background-color: inherit;
        color: inherit;
      }
    </style>

    <!-- Viewport & PWA basics -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#850bc4" />
    <meta name="description" content="Choir management app for songs, parts, and rehearsals" />

    <!-- __OG_TAGS__ -->
    <!-- Default Open Graph / Social Preview fallback (overridden server-side for bots, and by react-helmet-async in-browser) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DGC Resound" />
    <meta property="og:title" content="DGC Resound — Choir Management" />
    <meta property="og:description" content="Manage songs, rehearsal parts, playlists, and rosters for DGC Resound choir." />
    <meta property="og:image" content="https://choir-sync.vercel.app/icon-512x512.png" />
    <meta property="og:url" content="https://choir-sync.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DGC Resound — Choir Management" />
    <meta name="twitter:description" content="Manage songs, rehearsal parts, playlists, and rosters for DGC Resound choir." />
    <meta name="twitter:image" content="https://choir-sync.vercel.app/icon-512x512.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DGC Resound" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
